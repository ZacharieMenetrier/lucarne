<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1e26" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lucarne" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Lucarne</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- iPadOS 26+ blurs the top of Home Screen apps unless a fixed, full-width, solid element taller than 10px sits at the top edge. This band gives WebKit that solid colour without painting anything. -->
    <div id="ios-edge" aria-hidden="true"></div>
    <div id="app" class="no-sprite">
      <header id="topbar">
        <span class="spacer"></span>
        <span id="save-status" data-status="saved">Saved</span>
        <button id="sync" class="icon sync" title="Sync with GitHub" aria-label="Sync with GitHub" hidden></button>
        <button id="run-game" class="run-game" title="Play the game (⌘↵)"></button>
      </header>

      <nav id="tools" aria-label="Tools"></nav>

      <main id="stage">
        <canvas id="canvas"></canvas>
        <div id="selbar" hidden></div>
        <button id="anim-toggle" class="icon" title="Animation panel (A)" aria-label="Animation panel"></button>
        <!-- How the board is shown: on the canvas, since they only change the canvas. -->
        <div class="view-controls" role="toolbar" aria-label="View">
          <button id="fit" class="icon" title="Show every sprite (0)" aria-label="Show every sprite"></button>
          <button id="grid" class="icon" title="Grid (#)" aria-label="Grid"></button>
          <button id="checker" class="icon" title="Checkerboard" aria-label="Checkerboard"></button>
          <button id="background" class="icon" title="Board color" aria-label="Board color"><span id="background-swatch"></span></button>
        </div>
        <div id="empty">
          <p>No sprites yet.</p>
          <button id="empty-new" class="primary">New sprite</button>
        </div>
      </main>

      <section id="frames" hidden>
        <div class="frames-bar">
          <div class="bar-side">
            <label class="fps" title="Frames per second, for the whole animation">FPS <input id="fps" type="range" min="2" max="24" step="1" list="fps-ticks" /><output id="fps-value"></output><datalist id="fps-ticks"><option value="2"></option><option value="3"></option><option value="4"></option><option value="5"></option><option value="6"></option><option value="7"></option><option value="8"></option><option value="9"></option><option value="10"></option><option value="11"></option><option value="12"></option><option value="13"></option><option value="14"></option><option value="15"></option><option value="16"></option><option value="17"></option><option value="18"></option><option value="19"></option><option value="20"></option><option value="21"></option><option value="22"></option><option value="23"></option><option value="24"></option></datalist></label>
          </div>
          <button id="play" class="small icon-btn" title="Play / pause (Enter)" aria-label="Play"></button>
          <div class="bar-side end">
            <button id="frame-add" class="small icon-btn" title="New blank frame after this one" aria-label="New frame"></button>
            <button id="frame-dup" class="small icon-btn" title="Duplicate frame" aria-label="Duplicate frame"></button>
            <button id="frame-del" class="small icon-btn danger" title="Delete frame" aria-label="Delete frame"></button>
          </div>
        </div>
        <div id="frame-strip"></div>
      </section>

      <aside id="side">
        <section id="palette-panel">
          <div class="panel-head">
            <h2>Palette</h2>
            <button id="palette-edit" class="small icon-btn" title="Edit palette" aria-label="Edit palette"></button>
          </div>
          <div id="palette-grid"></div>
          <p id="palette-warning" class="warning" hidden></p>
        </section>
        <section id="sprites-panel">
          <div class="panel-head">
            <h2>Sprites</h2>
            <button id="sprites-new" class="small icon-btn" title="New sprite" aria-label="New sprite"></button>
          </div>
          <div id="sprite-list"></div>
        </section>
        <section id="tilesets-panel">
          <div class="panel-head">
            <h2>Tilesets</h2>
            <button id="tilesets-new" class="small icon-btn" title="New tileset" aria-label="New tileset"></button>
          </div>
          <div id="tileset-list"></div>
        </section>
        <section id="fonts-panel">
          <div class="panel-head">
            <h2>Fonts</h2>
            <button id="fonts-new" class="small icon-btn" title="New font" aria-label="New font"></button>
          </div>
          <div id="font-list"></div>
        </section>
      </aside>
    </div>
    <div id="toast" role="status"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
